services:
  lawyerup:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      GEMINI_TTS: ${GEMINI_TTS:-}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # Ollama running on the host machine: inside the container that is
      # host.docker.internal, not 127.0.0.1.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-}
      SEED_DEMO_ACCOUNT: ${SEED_DEMO_ACCOUNT:-}
      SEED_DEMO_LAWYER: ${SEED_DEMO_LAWYER:-}
    # Accounts database (SQLite). Kept in a named volume so it survives
    # rebuilds; `docker compose down -v` deletes it.
    volumes:
      - lawyerup-data:/app/data

volumes:
  lawyerup-data:
